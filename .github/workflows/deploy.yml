name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Sync into deployment directory
        run: rsync -av --exclude .git ./ ~/patr-app/

      - name: Rebuild and restart containers
        run: |
          cd ~/patr-app
          docker compose up -d --build
